<section class="detalhe">
    @if(carregando()){
        <p>carregando....</p>
    }
    @else{
        @if(!produto()){
            <p>Produto não encontrado</p>
            <button (click)="voltar()">Voltar</button>
        }
        @else{
            <article class="detalhe-card">
                <img class="thumb" [src]="produto()?.imgurl">
                <div class="infos">
                    <h2>((produto()!nome))</h2>
                    <p class="descricao" {{produto()!.descobrir}}></p>
                    @if(produto()!.promo){
                        {{produto().preco | desconto:10 : currency:'BRL': symbol:'1.2.2'}}
                    }
                    @else{
                        {{produto().preco | currency:'BRL': symbol:'1.2.2'}}
                    }

                    <div class="acoes">
                        <button class="btn ghost" (click)="voltar">
                            voltar
                        </button>
                    </div>
                </div>
            </article>
        }
    }
</section>
