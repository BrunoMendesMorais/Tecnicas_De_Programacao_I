<section class="catalogo">
    <header class="barradetarefas">
        <h2>Catalogo</h2>
        <button class="btn sopromo" [class.ativo]="apenasPromo()" (click)="alternarPromo()">
            @if(apenasPromo()){
                Mostrar todos
            }
            @else{
                Mostrar Promoções
            }
            </button>
    </header>
    @if(produtosExibidos().length == 0){
        <p class="vazio">Nenhum produto encontrado</p>
    }
    @else {
        <div class="grid">
            @for(product of produtosExibidos(); track product.id){
                <app-card-produto [produto]="product" (view)="onViewProduct($event)" (add)="onAddProduct($event)"></app-card-produto>
            }
        </div>
    }
</section>
