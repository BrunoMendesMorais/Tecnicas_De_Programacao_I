<article class="card" [class.promo]="produto().promo">
    <img class="thumb" [src]="this.produto().imageUrl">
    <div class="conteudo">

        <header class="cabecalho">
            <h3 class="titulo">{{produto().nome}}</h3>
            @switch (produto().estado) {
                @case ('novo') {
                    <span class="selo novo">Novo</span>
                }
                @case ('esgotado') {
                    <span class="selo esgotado">Esgotado</span>
                }
            }
            @if (produto().promo) {
                <span class="selo promo">Aproveite</span>
            }
        </header>
        <h3 class="titulo">{{this.produto().nome}}</h3>
        <p class="desc">{{this.produto().descricao}}</p>

        <div>
            <span class="preco"> {{produto().preco | currency:'BRL'}}</span>
            <app-quantidade-controle [(contador)]="quantidade"></app-quantidade-controle>
        </div>

        <div class="acoes">
            @if(produto().estado != 'esgotado' && quantidade() > 0){
                <button type="button" class="btn primary" (click)="onAdd()">Adicionar</button>
            }          
            <button type="button" class="btn ghost" (click)="onView()">Detalhe</button>
        </div>
    </div>
</article>
